spring.application.name=kofia-trans
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never

# Schema migrations (src/main/resources/db/migration) run automatically on startup.
# Databases created before Flyway are baselined at V1 and only receive the newer scripts.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# The optional demo seed may be applied once and then left out of FLYWAY_LOCATIONS: don't fail on it.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.demo.username=${DEMO_USERNAME:}
app.bootstrap.demo.password=${DEMO_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
