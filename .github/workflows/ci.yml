name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # KofiaTransApplicationTests needs a real PostgreSQL database, so it is excluded here.
      - name: Run tests
        run: ./mvnw -B verify -Dtest='!KofiaTransApplicationTests'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload application jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kofia-trans-jar
          path: target/*.jar

  lint-api-spec:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint docs/openapi.yaml
        run: npx --yes @redocly/cli@1.25.0 lint docs/openapi.yaml
